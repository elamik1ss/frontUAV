<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Симулятор БПЛА</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }
        .controls {
            position: absolute;
            top: 10px;
            right: 10px;
            background: white;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            z-index: 999;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="controls">
        <h3>Симулятор БПЛА</h3>
        <button onclick="addDrone()">Добавить дрон</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Инициализация карты с центром на Украину/Россию
        const map = L.map('map').setView([50, 40], 4);

        // Добавляем слой OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);

        // Маркеры дронов
        const drones = [];

        function addDrone() {
            const lat = Math.random() * 10 + 45;
            const lng = Math.random() * 30 + 25;
            
            const marker = L.marker([lat, lng]).addTo(map)
                .bindPopup('Дрон #' + (drones.length + 1));
            
            drones.push(marker);
            console.log('Дрон добавлен:', [lat, lng]);
        }
    </script>
</body>
</html>
