<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Geran-2 Simulator</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-block">
          <div class="brand-dot"></div>
          <div>
            <div class="eyebrow">Drone control</div>
            <h1>Geran-2</h1>
          </div>
        </div>

        <div class="panel">
          <div class="panel-header">Команда</div>
          <div class="button-group" id="sideSelector">
            <button class="side-button active" data-side="ukraine" type="button">🇺🇦 Украина</button>
            <button class="side-button" data-side="russia" type="button">🇷🇺 Россия</button>
          </div>
        </div>

        <div class="panel">
          <div class="panel-header">Дрон</div>
          <div class="drone-card selected" id="droneCard">
            <div class="drone-card__icon" aria-hidden="true"></div>
            <div>
              <div class="drone-card__name">Geran-2</div>
              <div class="drone-card__meta">Стратегический БПЛА</div>
            </div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-header">Скорость</div>
          <div class="speed-control">
            <label for="speedSlider">Скорость: <span id="speedValue">1.0x</span></label>
            <input id="speedSlider" type="range" min="0.5" max="3" step="0.5" value="1" />
          </div>
        </div>

        <div class="panel">
          <div class="panel-header">Запуск</div>
          <button id="launchBtn" class="launch-btn" type="button">Запуск</button>
        </div>

        <div class="panel legend-panel">
          <div class="panel-header">Управление</div>
          <ul class="legend-list">
            <li><span class="legend-key left-key"></span>ЛКМ — маршрут</li>
            <li><span class="legend-key right-key"></span>ПКМ — точка падения</li>
            <li><span class="legend-key middle-key"></span>W/A/S/D — смещать карту</li>
          </ul>
        </div>

        <div class="status-box" id="statusBox">
          Выберите сторону и кликните по карте, чтобы разместить дрон.
        </div>
      </aside>

      <main class="map-panel">
        <div id="map"></div>
      </main>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="./script.js"></script>
  </body>
</html>
